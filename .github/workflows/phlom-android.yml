name: Phlom Android APK

on:
  push:
    branches: [phlom-ai]
    paths:
      - 'Phlom-AI/**'
      - '.github/workflows/phlom-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle -p Phlom-AI :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phlom-ai-debug-apk
          path: Phlom-AI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
