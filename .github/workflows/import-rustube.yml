name: Import Rustube source archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Extract Rustube source
        shell: bash
        run: |
          set -euo pipefail
          test -f Rustube-source.zip || {
            echo "::error::Upload Rustube-source.zip to the repository root first."
            exit 1
          }
          unzip -q Rustube-source.zip -d /tmp/rustube-archive
          test -d /tmp/rustube-archive/Rustube
          cp -a /tmp/rustube-archive/Rustube/. .
          rm -rf /tmp/rustube-archive Rustube-source.zip
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import Rustube Android source"
          git push
